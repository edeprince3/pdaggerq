# pytest.ini
[pytest]
markers =
    ccsd: numerical CCSD test
    ccsd_disk: numerical CCSD test with python functions written to disk
    ccsdt: numerical CCSDT test
    cc3: numerical CC3 test
    lambda_ccsd: numerical lambda-CCSD test
    qed_ccsd: numerical QED-CCSD-21
    eomcc: numerical EOMCCSD test with right/left eigensolve and oscillator strengths
    qed_eomcc: numerical QED-EOMCCSD-21 test with right eigensolve 
    ip_eomcc: numerical IP-EOMCCSD test with right eigensolve
    ea_eomcc: numerical EA-EOMCCSD test with right eigensolve
    ucc3: numerical UCCSD(3) test
    ucc4: numerical UCCSD(4) test
    quccsd: numerical QUCCSD test
