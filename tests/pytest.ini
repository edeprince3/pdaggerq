# pytest.ini
[pytest]
markers =
    ccsd: numerical CCSD test
    ccsd_disk: numerical CCSD test with python functions written to disk
    ccsdt: numerical CCSDT test
    cc3: numerical CC3 test
    lambda_ccsd: numerical lambda-CCSD test
    qed_ccsd_21: numerical QED-CCSD-21
    qed_ccsd_22: numerical QED-CCSD-22
    eomccsd: numerical EOMCCSD test with right/left eigensolve and oscillator strengths
    qed_eomccsd: numerical QED-EOMCCSD-21 test with right eigensolve 
    ip_eomccsd: numerical IP-EOMCCSD test with right/left eigensolve
    ip_eomccsdt: numerical IP-EOMCCSDT test with right/left eigensolve
    ea_eomccsd: numerical EA-EOMCCSD test with right/left eigensolve
    ea_eomccsdt: numerical EA-EOMCCSDT test with right/left eigensolve
    uccsd3: numerical UCCSD(3) test
    uccsd4: numerical UCCSD(4) test
    quccsd: numerical QUCCSD test
    ccsd_polarizability: numerical CCSD polarizability test
    dip_eomccsd: numerical DIP-EOMCCSD test with right/left eigensolve
    dea_eomccsd: numerical DEA-EOMCCSD test with right/left eigensolve
